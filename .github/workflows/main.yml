
name: Google Sheets to Supabase

on:
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install sqlalchemy psycopg2-binary

      - name: Run ETL
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          WORKSHEET: ${{ vars.WORKSHEET }}
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
          PG_USER: ${{ vars.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_HOST: ${{ vars.PG_HOST }}
          PG_PORT: ${{ vars.PG_PORT }}
          PG_DB: ${{ vars.PG_DB }}
          PG_TABLE: ${{ vars.PG_TABLE }}
        run: python etl.py
